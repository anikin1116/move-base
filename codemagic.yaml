workflows:
  ios-release:
    name: MoveBase iOS Release
    max_build_duration: 60
    environment:
      groups:
        - movebase_secrets
      flutter: stable
      vars:
        APP_STORE_APPLE_ID: "6796435104"
        APP_STORE_CONNECT_ISSUER_ID: "0c72b8d2-f4a7-4924-a73b-b657b5fe5c39"
        APP_STORE_CONNECT_KEY_IDENTIFIER: "Y79JG4VG3G"
    scripts:
      - name: Get Flutter packages
        script: flutter pub get
      - name: Fetch signing files
        script: |
          app-store-connect fetch-signing-files com.mycompany.moveBase \
            --create --type IOS_APP_STORE --platform IOS \
            --issuer-id $APP_STORE_CONNECT_ISSUER_ID \
            --key-id $APP_STORE_CONNECT_KEY_IDENTIFIER \
            --private-key @env:AUTH_KEY \
            --certificate-key @env:CERTIFICATE_KEY
      - name: Initialize keychain
        script: keychain initialize
      - name: Import cert and set partition list
        script: |
          set -e
          P12=$(ls /Users/builder/Library/Developer/Xcode/UserData/Certificates/*.p12 | head -1)
          KEYCHAIN=$(ls /Users/builder/Library/codemagic-cli-tools/keychains/*.keychain-db | head -1)
          echo "P12: $P12 ($(wc -c < "$P12") bytes)"
          echo "Keychain: $KEYCHAIN"

          # Extract cert (the .p12 is a PEM cert file in codemagic-cli-tools 0.69.0)
          if openssl pkcs12 -legacy -in "$P12" -nokeys -clcerts -passin pass:"" -out /tmp/sign.crt 2>/dev/null && [ -s /tmp/sign.crt ]; then
            echo "Cert read as PKCS12"
          elif openssl x509 -in "$P12" -inform DER -out /tmp/sign.crt 2>/dev/null && [ -s /tmp/sign.crt ]; then
            echo "Cert read as DER"
          elif openssl x509 -in "$P12" -inform PEM -out /tmp/sign.crt 2>/dev/null && [ -s /tmp/sign.crt ]; then
            echo "Cert read as PEM"
          else
            echo "ERROR: cannot read cert"; exit 1
          fi

          echo "Cert SHA1: $(openssl x509 -in /tmp/sign.crt -fingerprint -noout | sed 's/.*Fingerprint=//;s/://g')"

          # Write private key
          echo "$CERTIFICATE_KEY" > /tmp/sign.key

          # Try PKCS12 with SHA-1 MAC (traditional format macOS security import expects)
          if openssl pkcs12 -export -legacy \
               -in /tmp/sign.crt -inkey /tmp/sign.key \
               -out /tmp/fixed.p12 -passout pass:"" \
               -macalg sha1 -keypbe PBE-SHA1-3DES -certpbe PBE-SHA1-3DES 2>&1 \
             && security import /tmp/fixed.p12 -k "$KEYCHAIN" -P "" \
               -T /usr/bin/codesign -T /usr/bin/security -A 2>&1; then
            echo "PKCS12 import succeeded"
          else
            echo "PKCS12 import failed, falling back to separate cert+key import"
            security import /tmp/sign.crt -k "$KEYCHAIN" -T /usr/bin/codesign -T /usr/bin/security -A || echo "Cert import warning"
            security import /tmp/sign.key -k "$KEYCHAIN" -T /usr/bin/codesign -T /usr/bin/security -A || echo "Key import warning"
          fi

          # Make key accessible for codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "" "$KEYCHAIN"

          # Add keychain to search list
          security list-keychains -s "$KEYCHAIN" ~/Library/Keychains/login.keychain-db
          security default-keychain -s "$KEYCHAIN"

          echo "--- Identities in keychain ---"
          security find-identity -v -p codesigning "$KEYCHAIN" || true
          echo "---"
      - name: Diagnose signing match
        script: |
          KEYCHAIN=$(ls /Users/builder/Library/codemagic-cli-tools/keychains/*.keychain-db | head -1)
          echo "=== Keychain cert SHA1 ==="
          security find-identity -v -p codesigning "$KEYCHAIN" || true

          printf '%s\n' \
            'import sys, plistlib, hashlib' \
            'data = sys.stdin.buffer.read()' \
            'plist = plistlib.loads(data)' \
            'print("UUID:", plist.get("UUID", "N/A"))' \
            'ent = plist.get("Entitlements", {})' \
            'print("AppID:", ent.get("application-identifier", "N/A"))' \
            'for i, cert in enumerate(plist.get("DeveloperCertificates", [])):' \
            '    sha1 = hashlib.sha1(bytes(cert)).hexdigest().upper()' \
            '    print("Cert", i, "SHA1:", sha1)' \
            > /tmp/check_profiles.py

          echo "=== Profile cert SHA1s ==="
          for prof in "/Users/builder/Library/Developer/Xcode/UserData/Provisioning Profiles/"*.mobileprovision; do
            [ -f "$prof" ] || continue
            echo "--- $(basename "$prof") ---"
            security cms -D -i "$prof" 2>/dev/null | python3 /tmp/check_profiles.py || echo "Failed to parse"
          done

          echo "=== Bundle IDs in xcodeproj ==="
          grep "PRODUCT_BUNDLE_IDENTIFIER" /Users/builder/clone/ios/Runner.xcodeproj/project.pbxproj | head -10
      - name: Set up iOS signing
        script: xcode-project use-profiles --verbose
      - name: Build iOS
        script: |
          flutter build ipa \
            --release \
            --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        api_key: $AUTH_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true

  android-release:
    name: MoveBase Android Release
    max_build_duration: 60
    environment:
      groups:
        - movebase_secrets
      flutter: stable
      android_signing:
        - movebase_keystore
    scripts:
      - name: Get Flutter packages
        script: flutter pub get
      - name: Build Android
        script: |
          flutter build appbundle \
            --release
    artifacts:
      - build/app/outputs/bundle/release/*.aab
    publishing:
      google_play:
        credentials: $GCLOUD_SERVICE_ACCOUNT_CREDENTIALS
        track: internal
