workflows:
  ios-release:
    name: MoveBase iOS Release
    max_build_duration: 60
    environment:
      groups:
        - movebase_secrets
      flutter: stable
      vars:
        APP_STORE_APPLE_ID: "6796435104"
        APP_STORE_CONNECT_ISSUER_ID: "0c72b8d2-f4a7-4924-a73b-b657b5fe5c39"
        APP_STORE_CONNECT_KEY_IDENTIFIER: "Y79JG4VG3G"
    scripts:
      - name: Get Flutter packages
        script: flutter pub get
      - name: Initialize keychain
        script: keychain initialize
      - name: Fetch signing files
        script: |
          app-store-connect fetch-signing-files com.mycompany.moveBase \
            --create --type IOS_APP_STORE --platform IOS \
            --issuer-id $APP_STORE_CONNECT_ISSUER_ID \
            --key-id $APP_STORE_CONNECT_KEY_IDENTIFIER \
            --private-key @env:AUTH_KEY \
            --certificate-key @env:CERTIFICATE_KEY
      - name: Add certificates to keychain
        script: keychain add-certificates
      - name: Set up iOS signing
        script: xcode-project use-profiles
      - name: Pod install
        script: cd ios && pod install
      - name: Build iOS
        script: |
          BUILD_NUMBER=$(python3 -c "import re; print(re.search(r'version:\s*[\d.]+\+(\d+)', open('pubspec.yaml').read()).group(1))")
          BUILD_NAME=$(python3 -c "import re; print(re.search(r'version:\s*([\d.]+)\+', open('pubspec.yaml').read()).group(1))")
          echo "Building $BUILD_NAME+$BUILD_NUMBER"
          cd ios && agvtool new-version -all $BUILD_NUMBER && cd ..
          flutter build ipa \
            --release \
            --build-name=$BUILD_NAME \
            --build-number=$BUILD_NUMBER \
            --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        api_key: $AUTH_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true

  android-release:
    name: MoveBase Android Release
    max_build_duration: 60
    environment:
      groups:
        - movebase_secrets
      flutter: stable
      android_signing:
        - movebase_keystore
    scripts:
      - name: Get Flutter packages
        script: flutter pub get
      - name: Build Android
        script: |
          BUILD_NUMBER=$(grep "^version:" pubspec.yaml | sed 's/.*+//')
          flutter build appbundle \
            --release \
            --build-number=$BUILD_NUMBER
    artifacts:
      - build/app/outputs/bundle/release/*.aab
    publishing:
      google_play:
        credentials: $GCLOUD_SERVICE_ACCOUNT_CREDENTIALS
        track: internal
