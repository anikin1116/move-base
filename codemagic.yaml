workflows:
  ios-release:
    name: MoveBase iOS Release
    max_build_duration: 60
    environment:
      flutter: stable
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.mycompany.moveBase
      vars:
        APP_STORE_APPLE_ID: "6796435104"
    scripts:
      - name: Get Flutter packages
        script: flutter pub get
      - name: Set up iOS signing
        script: xcode-project use-profiles
      - name: Build iOS
        script: |
          flutter build ipa \
            --release \
            --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true

  android-release:
    name: MoveBase Android Release
    max_build_duration: 60
    environment:
      flutter: stable
      android_signing:
        - movebase_keystore
    scripts:
      - name: Get Flutter packages
        script: flutter pub get
      - name: Build Android
        script: |
          flutter build appbundle \
            --release
    artifacts:
      - build/app/outputs/bundle/release/*.aab
    publishing:
      google_play:
        credentials: $GCLOUD_SERVICE_ACCOUNT_CREDENTIALS
        track: internal
