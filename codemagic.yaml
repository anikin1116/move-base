workflows:
  ios-release:
    name: MoveBase iOS Release
    max_build_duration: 60
    environment:
      groups:
        - movebase_secrets
      flutter: stable
      vars:
        APP_STORE_APPLE_ID: "6796435104"
        APP_STORE_CONNECT_ISSUER_ID: "0c72b8d2-f4a7-4924-a73b-b657b5fe5c39"
        APP_STORE_CONNECT_KEY_IDENTIFIER: "Y79JG4VG3G"
    scripts:
      - name: Get Flutter packages
        script: flutter pub get
      - name: Fetch signing files
        script: |
          app-store-connect fetch-signing-files com.mycompany.moveBase \
            --create --type IOS_APP_STORE --platform IOS \
            --issuer-id $APP_STORE_CONNECT_ISSUER_ID \
            --key-id $APP_STORE_CONNECT_KEY_IDENTIFIER \
            --private-key @env:AUTH_KEY \
            --certificate-key @env:CERTIFICATE_KEY
      - name: Initialize keychain
        script: keychain initialize
      - name: Import cert and set partition list
        script: |
          set -e
          KEYCHAIN=$(ls /Users/builder/Library/codemagic-cli-tools/keychains/*.keychain-db | head -1)
          echo "Keychain: $KEYCHAIN"
          keychain add-certificates
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "" "$KEYCHAIN"
          echo "Done"
      - name: Set up iOS signing
        script: xcode-project use-profiles
      - name: Build iOS
        script: |
          flutter build ipa \
            --release \
            --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        api_key: $AUTH_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true

  android-release:
    name: MoveBase Android Release
    max_build_duration: 60
    environment:
      groups:
        - movebase_secrets
      flutter: stable
      android_signing:
        - movebase_keystore
    scripts:
      - name: Get Flutter packages
        script: flutter pub get
      - name: Build Android
        script: |
          flutter build appbundle \
            --release
    artifacts:
      - build/app/outputs/bundle/release/*.aab
    publishing:
      google_play:
        credentials: $GCLOUD_SERVICE_ACCOUNT_CREDENTIALS
        track: internal
