workflows:
  ios-release:
    name: MoveBase iOS Release
    max_build_duration: 60
    environment:
      flutter: stable
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.mycompany.moveBase
      vars:
        APP_STORE_APPLE_ID: "6796435104"
    scripts:
      - name: Get Flutter packages
        script: flutter pub get
      - name: Fix p12 for macOS keychain
        script: |
          set -e
          P12=$(ls /Users/builder/Library/Developer/Xcode/UserData/Certificates/*.p12 | head -1)
          KEYCHAIN=$(ls /Users/builder/Library/codemagic-cli-tools/keychains/*.keychain-db | head -1)
          echo "P12: $P12"
          echo "Keychain: $KEYCHAIN"

          # Use Homebrew OpenSSL 3.x — it supports AES-256 p12 input AND legacy output
          # macOS system LibreSSL cannot read AES-256 encrypted p12 files
          OPENSSL=/usr/bin/openssl
          for candidate in /opt/homebrew/opt/openssl@3/bin/openssl /usr/local/opt/openssl@3/bin/openssl; do
            if [ -f "$candidate" ]; then OPENSSL="$candidate"; break; fi
          done
          echo "OpenSSL: $($OPENSSL version)"

          # Extract cert from the AES-256 p12
          $OPENSSL pkcs12 -in "$P12" -nokeys -clcerts -passin pass:"" -out /tmp/sign.crt
          [ -s /tmp/sign.crt ] || { echo "ERROR: cert extraction failed"; exit 1; }
          echo "Cert extracted"

          # Write private key and recreate p12 with legacy 3DES (macOS-compatible)
          echo "$CERTIFICATE_KEY" > /tmp/sign.key
          $OPENSSL pkcs12 -legacy -export -in /tmp/sign.crt -inkey /tmp/sign.key -out /tmp/fixed.p12 -passout pass:""
          echo "Legacy p12 created"

          # Import into keychain
          security import /tmp/fixed.p12 -k "$KEYCHAIN" -T /usr/bin/codesign -T /usr/bin/security -P "" -A
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "" "$KEYCHAIN"
          echo "Done"
      - name: Set up iOS signing
        script: xcode-project use-profiles
      - name: Build iOS
        script: |
          flutter build ipa \
            --release \
            --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true

  android-release:
    name: MoveBase Android Release
    max_build_duration: 60
    environment:
      flutter: stable
      android_signing:
        - movebase_keystore
    scripts:
      - name: Get Flutter packages
        script: flutter pub get
      - name: Build Android
        script: |
          flutter build appbundle \
            --release
    artifacts:
      - build/app/outputs/bundle/release/*.aab
    publishing:
      google_play:
        credentials: $GCLOUD_SERVICE_ACCOUNT_CREDENTIALS
        track: internal
